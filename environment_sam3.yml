name: sam3_shrubs

channels:
  - conda-forge

dependencies:
  - python=3.12
  - numpy>=1.26,<2
  - rasterio
  - matplotlib
  - einops
  # SAM 3 imports the deprecated pkg_resources module.
  - setuptools<81
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - pillow
      - torch==2.11.0
      - torchvision
      - pycocotools>=2.0.11
      - psutil
      # Imported unconditionally by sam3.train.transforms.point_sampling
      # (used for training's box-noise augmentation), but missing from
      # sam3[train]'s own declared dependencies -- it's only listed under
      # sam3's separate "dev"/"notebooks" extras upstream. Pinned below
      # numpy>=2 (opencv-python 4.12+ requires numpy>=2 on Python 3.9+,
      # conflicting with sam3's own numpy<2 pin).
      - opencv-python==4.11.0.86
      # SAM 3 imports Triton; PyTorch 2.11 requires the Triton 3.6 line.
      - triton==3.6.0
      - "sam3[train] @ git+https://github.com/facebookresearch/sam3.git"
