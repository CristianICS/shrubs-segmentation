# @package _global_
#
# Derived from SAM 3's fine-tuning config
# sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml
# (https://github.com/facebookresearch/sam3), Copyright (c) Meta Platforms, Inc.
# and affiliates. This file is a derivative of SAM Materials and is distributed
# under the SAM License, not this repository's MIT license: see the LICENSE file
# in this folder.
defaults:
  - _self_

# ============================================================================
# Paths (filled in by Python/sam3_domain_adapt.py via Hydra command-line
# overrides, not edited by hand).
# ============================================================================
paths:
  train_ann_file: <TRAIN_ANN_FILE>
  train_img_folder: <TRAIN_IMG_FOLDER>
  val_ann_file: <VAL_ANN_FILE>
  val_img_folder: <VAL_IMG_FOLDER>
  experiment_log_dir: <EXPERIMENT_LOG_DIR>
  bpe_path: <BPE_PATH>

# ============================================================================
# JuniperMapper dataset configuration
#
# Adapted from SAM 3's own upstream fine-tuning example
# (sam3/train/configs/roboflow_v100/roboflow_v100_full_ft_100_images.yaml),
# with `enable_segmentation` turned on (JuniperMapper is a mask task, not a
# box-only one) and the mask loss term restored from that same file's
# commented-out segmentation branch.
# ============================================================================
juniper_train:
  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline. Unlike the upstream box-only example this
  # file is adapted from (which never loaded masks on the val split at all),
  # DecodeRle must run here too now that enable_segmentation is on -- without
  # it, obj.segment is still a raw RLE dict when the resize transform tries
  # to index it as a tensor, raising `KeyError: (None, None)`.
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # Loss config, including the mask term (JuniperMapper trains segmentation,
  # unlike the box-only upstream example this file is adapted from).
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0
          presence_loss: 20.0
        pos_weight: 10.0
        alpha: 0.25
        gamma: 2
        use_presence: True
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false
    loss_fn_semantic_seg: null
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Helper parameters
# ============================================================================
scratch:
  enable_segmentation: True

  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  # Same post-processing, but also returning each prediction's mask resized
  # to the original tile size and RLE-encoded, so the in-loop validation can
  # score masks (COCO "segm") instead of only boxes. It keeps the top 100
  # detections, the same cap the PredictionDumper applies afterwards anyway.
  original_mask_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: 100
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    convert_mask_to_rle: true
    # Interpolate masks on whatever device they already live on, so a
    # `--device cpu` run doesn't hit the upstream CUDA-only assertion.
    always_interpolate_masks_on_gpu: false
    use_presence: ${scratch.use_presence_eval}

  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True

  resolution: 1008
  consistent_transform: False
  max_ann_per_img: 200

  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  num_train_workers: 4
  num_val_workers: 0
  hybrid_repeats: 1
  gather_pred_via_filesys: false

  # Single LR group: both backbones are frozen by FrozenBackboneTrainer, so
  # this schedule only ever touches the transformer/detection/segmentation
  # head (there is no separate backbone group to decay, unlike the upstream
  # full fine-tuning example this file is adapted from).
  lr_scale: 0.1
  lr_head: ${times:8e-4,${scratch.lr_scale}}
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  val_batch_size: 1
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: shrubs_val
    with_seg_masks: ${scratch.enable_segmentation}

  gradient_accumulation_steps: 1
  train_batch_size: 2
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation}

# ============================================================================
# Trainer configuration
# ============================================================================
trainer:
  _target_: shrubs_sam3.training.FrozenBackboneTrainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: False
  max_epochs: 30
  accelerator: cuda
  seed_value: 42
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    # nccl is the standard, well-tested backend for single/multi-GPU CUDA
    # training on Linux (including WSL2, the recommended way to run this
    # script -- see "SAM 3 training on WSL2" in README.md). sam3_domain_adapt.py
    # overrides this to gloo itself for a CPU run, or when it detects it's
    # running on native Windows, where nccl has no build at all and even
    # gloo needs a libuv-related workaround (see environment_sam3.yml).
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all: ${juniper_train.loss}
    default:
      _target_: sam3.train.loss.sam3_loss.DummyLoss

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        transforms: ${juniper_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.train_img_folder}
        ann_file: ${paths.train_ann_file}
      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        load_segmentation: ${scratch.enable_segmentation}
        img_folder: ${paths.val_img_folder}
        ann_file: ${paths.val_ann_file}
        transforms: ${juniper_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false
      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    device: cuda
    eval_mode: false
    enable_segmentation: ${scratch.enable_segmentation}
    # Left at their defaults (download the gated release checkpoint from
    # Hugging Face), or overridden by `--checkpoint` on the CLI to start
    # from an already-downloaded local release checkpoint instead, exactly
    # like `build_processor`'s zero-shot release-checkpoint branch in
    # bin/shrubs_sam3/utils.py.
    checkpoint_path: null
    load_from_HF: true

  # In-loop validation on the JuniperMapper Photo Interpretation Val split,
  # run after every epoch (`val_epoch_freq`). `segmentation` (COCO mask AP)
  # is the checkpoint-selection meter: FrozenBackboneTrainer copies the epoch
  # with the highest `coco_eval_segm_AP_50` to `checkpoints/model_best.pt`,
  # the same criterion Detectron2 (segm/AP50) and Matterport (mask AP50) use.
  # `detection` (box AP) is kept for reference only.
  meters:
    val:
      shrubs_val:
        segmentation:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "segm"
          dump_dir: ${launcher.experiment_log_dir}/dumps/shrubs_val
          merge_predictions: True
          postprocessor: ${scratch.original_mask_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.val_ann_file}
              tide: False
              iou_type: "segm"
        detection:
          _target_: sam3.eval.coco_writer.PredictionDumper
          iou_type: "bbox"
          dump_dir: ${launcher.experiment_log_dir}/dumps/shrubs_val
          merge_predictions: True
          postprocessor: ${scratch.original_box_postprocessor}
          gather_pred_via_filesys: ${scratch.gather_pred_via_filesys}
          maxdets: 100
          pred_file_evaluators:
            - _target_: sam3.eval.coco_eval_offline.CocoEvaluatorOfflineWithPredFileEvaluators
              gt_path: ${paths.val_ann_file}
              tide: False
              iou_type: "bbox"

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    options:
      lr:
        - scheduler:
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_head}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - '*bias*'
          module_cls_names: ['torch.nn.LayerNorm']

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 5
    # Upstream `save_best_meters` is left unset on purpose: it only fires for
    # meters exposing an `is_better` method, which SAM 3's PredictionDumper
    # doesn't have, so it never saved anything. Best-checkpoint selection is
    # done by FrozenBackboneTrainer instead (see `meters` above).
    save_best_meters: null

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs
    log_freq: 10

# ============================================================================
# Launcher (single-node, single-GPU; no SLURM/submitit support)
# ============================================================================
launcher:
  num_nodes: 1
  gpus_per_node: 1
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver
